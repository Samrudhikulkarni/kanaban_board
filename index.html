<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StickyBoard</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="cards/card.css">
<link rel="stylesheet" href="calendar/calendar.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i class="bi bi-pin-angle-fill"></i> StickyBoard</div>
    <div class="nav-label">Workspace</div>
    <nav class="nav flex-column gap-1">
      <button class="nv active" data-view="board"><i class="bi bi-kanban"></i>Board</button>
      <button class="nv" data-view="cal"><i class="bi bi-calendar3"></i>Calendar</button>
      <button class="nv" data-view="pinned"><i class="bi bi-pin-angle"></i>Pinned<span class="cnt" id="cPin">0</span></button>
      <button class="nv" data-view="remind"><i class="bi bi-bell"></i>Reminders<span class="cnt" id="cRem">0</span></button>
    </nav>
    <div class="me">
      <div class="avatar" id="avatar">S</div>
      <div class="lh-1 flex-grow-1 text-truncate"><div class="fw-bold" id="who"></div><small class="text-secondary">Free plan</small></div>
      <button class="ib-dark" id="theme" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
      <button class="ib-dark" id="out" title="Logout"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </aside>

  <section class="main">
    <div class="d-flex flex-wrap align-items-end gap-3 mb-3">
      <div><h1 id="hello">Hello</h1><p id="sub" class="text-body-secondary mb-0"></p></div>
      <div class="ms-auto d-flex gap-2 align-items-center">
        <div class="searchbox"><i class="bi bi-search"></i><input id="search" placeholder="Search notes…"></div>
        <button class="btn btn-ink rounded-pill px-4 py-2" id="add"><i class="bi bi-plus-lg me-1"></i>Add note</button>
      </div>
    </div>
    <div class="prog" id="prog"></div>
    <div class="d-flex flex-wrap gap-2 align-items-center my-3" id="filters"></div>
    <div id="viewBoard"><div id="board"></div></div>
    <div id="viewCal" class="hide"><div id="cal"></div></div>
  </section>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toast" class="toast" role="alert">
    <div class="toast-header"><i class="bi bi-bell-fill text-warning me-2"></i><strong class="me-auto">Reminder</strong><button class="btn-close" data-bs-dismiss="toast"></button></div>
    <div class="toast-body" id="toastBody"></div>
  </div>
</div>

<div class="modal fade" id="modal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="mTitle">New note</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label class="form-label fw-semibold">Title</label>
        <input id="fTitle" class="form-control mb-3" maxlength="60" placeholder="What needs doing?">
        <label class="form-label fw-semibold">Short description</label>
        <textarea id="fDesc" class="form-control mb-3" rows="2" maxlength="160"></textarea>
        <div class="row g-2 mb-3">
          <div class="col-6"><label class="form-label fw-semibold">Start</label><input id="fStart" type="date" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold">Due</label><input id="fDue" type="date" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold">Status</label><select id="fStatus" class="form-select"></select></div>
          <div class="col-6"><label class="form-label fw-semibold">Note style</label>
            <select id="fStyle" class="form-select"><option value="0">Yellow tape</option><option value="1">Blue spiral</option><option value="2">Red dotted</option><option value="3">Ruled paper</option></select></div>
        </div>
        <label class="form-label fw-semibold d-block">Tags</label>
        <div class="d-flex flex-wrap gap-2 mb-3" id="fTags"></div>
        <div class="d-flex gap-4">
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fPin"><label class="form-check-label" for="fPin"><i class="bi bi-pin-angle me-1"></i>Pin it</label></div>
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fRemind"><label class="form-check-label" for="fRemind"><i class="bi bi-bell me-1"></i>Remind me</label></div>
        </div>
        <div class="text-danger small fw-semibold mt-3" id="mErr"></div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-ink rounded-pill px-4" id="mSave">Save note</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/storage.js"></script>
<script src="cards/card.js"></script>
<script src="cards/cardModal.js"></script>
<script src="js/dragdrop.js"></script>
<script src="calendar/calendar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
