<div class="modal fade" id="modal" tabindex="-1" aria-labelledby="mTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" id="mTitle">New note</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <label class="form-label fw-semibold">Title</label>
        <input id="fTitle" class="form-control mb-3" maxlength="60" placeholder="What needs doing?">
        <label class="form-label fw-semibold">Short description</label>
        <textarea id="fDesc" class="form-control mb-3" rows="2" maxlength="160"></textarea>
        <div class="row g-2 mb-3">
          <div class="col-6"><label class="form-label fw-semibold">Start</label><input id="fStart" type="date" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold">Due</label><input id="fDue" type="date" class="form-control"></div>
          <div class="col-6"><label class="form-label fw-semibold">Status</label><select id="fStatus" class="form-select"></select></div>
          <div class="col-6"><label class="form-label fw-semibold">Note style</label>
            <select id="fStyle" class="form-select"><option value="0">Yellow tape</option><option value="1">Blue spiral</option><option value="2">Red dotted</option><option value="3">Ruled paper</option></select></div>
        </div>
        <label class="form-label fw-semibold d-block">Tags</label>
        <div class="d-flex flex-wrap gap-2 mb-3" id="fTags"></div>
        <div class="d-flex gap-4">
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fPin"><label class="form-check-label" for="fPin"><i class="bi bi-pin-angle me-1"></i>Pin it</label></div>
          <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="fRemind"><label class="form-check-label" for="fRemind"><i class="bi bi-bell me-1"></i>Remind me</label></div>
        </div>
        <div class="text-danger small fw-semibold mt-3" id="mErr"></div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-ink rounded-pill px-4" id="mSave">Save note</button>
      </div>
    </div>
  </div>
</div>
