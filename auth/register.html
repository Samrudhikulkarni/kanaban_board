<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notique – Register</title>
<link rel="icon" type="image/png" href="../assets/notique-logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="../shared/popup.css">
</head>
<body data-mode="register">
<section id="auth">
  <div class="authcard" data-bs-theme="light">
    <h1 class="h2 fw-bold mb-1"><img src="../assets/notique-logo.png" alt=""> Notique</h1>
    <p class="text-secondary">Create your account to start.</p>
    <label class="form-label fw-semibold">Full name</label>
    <input id="aName" class="form-control mb-3" autocomplete="name">
    <label class="form-label fw-semibold">Email</label>
    <input id="aEmail" type="email" class="form-control mb-3" autocomplete="email">
    <label class="form-label fw-semibold">Password</label>
    <input id="aPass" type="password" class="form-control" autocomplete="new-password">
    <div class="text-danger small fw-semibold mt-2" id="aErr" style="min-height:20px"></div>
    <button class="btn btn-danger w-100 mt-2" id="aGo">Create account</button>
    <p class="text-center mt-3 mb-0">Already registered? <a class="fw-bold text-danger" href="login.html">Login</a></p>
  </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../shared/popup.js"></script>
<script src="../js/storage.js"></script>
<script src="auth.js"></script>
</body>
</html>
